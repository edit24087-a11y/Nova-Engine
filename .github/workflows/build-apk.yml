name: Build & Test Nova Engine APK

on:
  push:
    branches: [ main, arena/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  # ---------------------------------------------------------------- core tests
  # Builds the C++17 engine core (headless) and runs the full 111-test suite.
  core-tests:
    name: C++ Engine Core Tests (111)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Build & run core test suite
        run: |
          chmod +x scripts/build_core.sh
          ./scripts/build_core.sh | tee /tmp/core.log
          # Fail the build if the suite did not report "FAILED: 0".
          grep -qE "PASSED: [0-9]+[[:space:]]+FAILED: 0" /tmp/core.log \
            || { echo "::error::C++ core test suite failed"; exit 1; }

  # ---------------------------------------------------------------- Android APK
  android:
    name: Build & Test Android APK
    runs-on: ubuntu-24.04
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK (platform 34, build-tools, NDK, CMake)
        run: |
          SDK="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK"
          # The runner may or may not ship the cmdline-tools; fetch them if absent.
          if ! find "$SDK" -name "sdkmanager" -type f 2>/dev/null | grep -q .; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SDKMANAGER="$(find "$SDK" -name "sdkmanager" -type f | head -1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          # Accept all SDK licenses non-interactively.
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Provision Gradle 8.7 wrapper
        run: |
          curl -fsSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7 --no-daemon
          chmod +x gradlew

      - name: Run unit tests (engine bridge parsing logic)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK artifacts
        run: |
          echo "== artifacts =="
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          echo "Debug APK bytes : $(stat -c%s app/build/outputs/apk/debug/app-debug.apk)"
          echo "Release APK bytes: $(stat -c%s app/build/outputs/apk/release/app-release-unsigned.apk)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-engine-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
