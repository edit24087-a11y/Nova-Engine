name: Build APK

on:
  push:
    branches: [ main, arena/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- core tests
  build-core:
    name: Build & Test C++ Core
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Build and run core test suite
        run: |
          chmod +x scripts/build_core.sh
          ./scripts/build_core.sh

  # ---------------------------------------------------------------- Android APK
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/native
          key: gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # The ubuntu-22.04 runner image has the Android SDK preinstalled.
          # Download cmdline-tools if sdkmanager is not found.
          if ! find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | grep -q .; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f | head -1)
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          # Accept all SDK licenses
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true

          # Install required components: platform 34, build-tools 34, NDK, CMake
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Download Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build Debug APK
        run: /tmp/gradle-8.7/bin/gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build-debug.log

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias nova \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nova-engine-store-pass \
            -keypass nova-engine-key-pass \
            -dname "CN=NovaEngine, OU=Dev, O=NovaEngine, L=NA, S=NA, C=US"

      - name: Build Release APK (unsigned)
        run: /tmp/gradle-8.7/bin/gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-key-alias nova \
            --ks-pass pass:nova-engine-store-pass \
            --key-pass pass:nova-engine-key-pass \
            --out "$OUT" "$APK"

      - name: Verify Release APK
        run: $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: /tmp/build-debug.log
          if-no-files-found: ignore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-engine-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Build Release AAB
        run: /tmp/gradle-8.7/bin/gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: nova-engine-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
